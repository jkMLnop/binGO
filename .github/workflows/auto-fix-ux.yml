# Auto-Fix UX Workflow — Phase 12.5 Phone-Driven Development
#
# When you file a UX bug from your phone (using the ux-bug template),
# this workflow auto-assigns GitHub Copilot to fix it.
#
# Flow: 📱 File issue → 🏷️ Label ux-fix → 🤖 Copilot picks it up → 🔧 PR created

name: auto-fix-ux

on:
  issues:
    types: [labeled]

# Only respond to the ux-fix label being added (not removed or other labels)
# The workflow_run trigger isn't suitable here — we want per-issue granularity.

permissions:
  issues: write      # add comments/labels
  contents: read     # read repo for context
  pull-requests: write  # in case we need to create PRs manually

jobs:
  assign-copilot:
    name: Assign Copilot to UX Issue
    if: github.event.label.name == 'ux-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Debug issue context
        run: |
          echo "Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          echo "Label: ${{ github.event.label.name }}"
          echo "Author: ${{ github.event.issue.user.login }}"

      - name: Assign Copilot to fix the issue
        id: copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Call the Copilot coding agent API to pick up this issue.
          # The agent reads the issue body (including screenshots!) and creates a PR.
          #
          # If this endpoint doesn't work from CI yet (API may be in beta),
          # the workflow will fall back to adding a comment.
          
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          
          RESPONSE=$(gh api \
            "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/copilot" \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            2>&1) || true
            
          echo "API response: ${RESPONSE}"
          
          if echo "${RESPONSE}" | grep -q '"html_url"'; then
            echo "copilot_assigned=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Copilot assigned to issue #${ISSUE_NUMBER}"
          else
            echo "copilot_assigned=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Copilot API call may have failed: ${RESPONSE}"
          fi
        continue-on-error: true

      - name: Fallback — add comment if Copilot API unavailable
        if: steps.copilot.outputs.copilot_assigned != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          
          gh api "repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --method POST \
            -f body='> 🤖 **Copilot auto-fix** could not be triggered automatically (API may not be available from CI yet).

            To fix this manually from your desk, tell Copilot:
            > `fix issue #'"${ISSUE_NUMBER}"'`

            Or trigger via CLI:
            ```bash
            gh copilot fix issue '"${ISSUE_NUMBER}"'
            ```'

      - name: Add in-progress label on success
        if: steps.copilot.outputs.copilot_assigned == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --add-label "copilot-fixing" \
            --repo "${{ github.repository }}"
